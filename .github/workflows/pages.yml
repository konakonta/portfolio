name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{steps.project_changes.outputs.publish}}
    steps:
      - uses: actions/checkout@v6
      - name: Check for project edits
        id: project_changes
        env:
          EVENT_NAME: ${{github.event_name}}
        run: |
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';
          let publish=true;
          if(process.env.EVENT_NAME==='schedule'){
            const [live,published]=await Promise.all([
              fetch('https://portfolio.racoome.workers.dev/api/projects',{signal:AbortSignal.timeout(20000)}),
              fetch('https://ivandonskoy.com/projects-snapshot.json',{cache:'no-store',signal:AbortSignal.timeout(20000)}),
            ]);
            if(!live.ok)throw new Error('Cannot read current projects');
            const current=await live.json();
            if(!Array.isArray(current.projects))throw new Error('Invalid current project list');
            if(published.ok){
              const previous=await published.json();
              publish=JSON.stringify(current.projects)!==JSON.stringify(previous.projects);
            }
          }
          await appendFile(process.env.GITHUB_OUTPUT,`publish=${publish}\n`);
          console.log(publish?'Publishing updated site':'No project edits; existing publication retained');
          NODE
      - uses: actions/configure-pages@v5
        if: steps.project_changes.outputs.publish == 'true'
      - name: Package public site and verified static assets
        if: steps.project_changes.outputs.publish == 'true'
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,mkdir,readdir,copyFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {dirname} from 'node:path';
          const manifest=JSON.parse(await readFile('pages-assets.json','utf8'));
          if(manifest.origin!=='https://portfolio.racoome.workers.dev')throw new Error('Unexpected asset origin');
          await mkdir('_site',{recursive:true});
          for(const entry of await readdir('.',{withFileTypes:true})){
            if(entry.isFile() && entry.name!=='pages-assets.json')await copyFile(entry.name,`_site/${entry.name}`);
          }
          const webmanifest=JSON.parse(await readFile('_site/site.webmanifest','utf8'));
          for(const icon of webmanifest.icons || [])icon.src=icon.src.replace(/^\//,'./');
          await writeFile('_site/site.webmanifest',JSON.stringify(webmanifest));
          // Publish the current public list alongside the site. An unavailable
          // API during deployment keeps the last checked-in public snapshot.
          try{
            const response=await fetch(`${manifest.origin}/api/projects`,{signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw new Error(`Projects: HTTP ${response.status}`);
            const data=await response.json();
            if(!Array.isArray(data.projects))throw new Error('Invalid project response');
            await writeFile('_site/projects-snapshot.json',JSON.stringify({...data,generatedAt:new Date().toISOString()}));
          }catch(error){
            try{
              const response=await fetch('https://ivandonskoy.com/projects-snapshot.json',{signal:AbortSignal.timeout(15000)});
              if(!response.ok)throw error;
              const data=await response.json();
              if(!Array.isArray(data.projects))throw error;
              await writeFile('_site/projects-snapshot.json',JSON.stringify(data));
            }catch{}
            const snapshot=JSON.parse(await readFile('_site/projects-snapshot.json','utf8'));
            if(!Array.isArray(snapshot.projects))throw error;
            console.warn('Using bundled project snapshot:',error.message);
          }
          async function download(file){
            if(!/^(assets|m_s_cond)\//.test(file.path) || file.path.split('/').some(part=>part.startsWith('.')))throw new Error('Invalid asset path');
            const path=file.path.split('/').map(encodeURIComponent).join('/');
            let bytes;
            for(let attempt=0;attempt<3;attempt++){
              try{
                const response=await fetch(`${manifest.origin}/${path}`,{signal:AbortSignal.timeout(60000)});
                if(!response.ok)throw new Error(`${file.path}: HTTP ${response.status}`);
                bytes=Buffer.from(await response.arrayBuffer());
                if(createHash('sha256').update(bytes).digest('hex')!==file.sha256)throw new Error(`Asset changed: ${file.path}`);
                break;
              }catch(error){if(attempt===2)throw error;}
            }
            await mkdir(dirname(`_site/${file.path}`),{recursive:true});
            await writeFile(`_site/${file.path}`,bytes);
          }
          for(let i=0;i<manifest.files.length;i+=4)await Promise.all(manifest.files.slice(i,i+4).map(download));
          const snapshot=JSON.parse(await readFile('_site/projects-snapshot.json','utf8'));
          const covers=[...new Set(snapshot.projects.map(project=>project.cover).filter(path=>/^\/media\/[a-f0-9-]+\.(jpg|png|webp)$/.test(path)))];
          await mkdir('_site/assets/project-media',{recursive:true});
          async function copyCover(path){
            const target=`_site/assets/project-media/${path.split('/').pop()}`;
            try{await readFile(target);return;}catch{}
            for(let attempt=0;attempt<3;attempt++){
              try{
                const response=await fetch(`${manifest.origin}${path}`,{signal:AbortSignal.timeout(60000)});
                if(!response.ok || !/^image\/(jpeg|png|webp)(;|$)/.test(response.headers.get('content-type') || ''))throw new Error(`Cover unavailable: ${path}`);
                const bytes=Buffer.from(await response.arrayBuffer());
                if(!bytes.length || bytes.length>16*1024*1024)throw new Error(`Invalid cover size: ${path}`);
                await writeFile(target,bytes);
                return;
              }catch(error){if(attempt===2)throw error;}
            }
          }
          for(let i=0;i<covers.length;i+=4)await Promise.all(covers.slice(i,i+4).map(copyCover));
          // Invalidate module and entry-point caches together, including web edits.
          const codeFiles=(await readdir('_site')).filter(file=>/\.(js|css)$/.test(file)).sort();
          const sources=await Promise.all(codeFiles.map(file=>readFile(`_site/${file}`,'utf8')));
          const version=createHash('sha256').update(sources.join('\n')).digest('hex').slice(0,12);
          for(const [index,file] of codeFiles.entries()){
            if(!file.endsWith('.js'))continue;
            await writeFile(`_site/${file}`,sources[index].replace(/(from\s+['"])(\.?\.?\/[^'"?]+\.js)(?:\?v=[^'"]+)?(['"])/g,`$1$2?v=${version}$3`));
          }
          const html=await readFile('_site/index.html','utf8');
          await writeFile('_site/index.html',html.replace(/((?:href|src)=["'])([^"'?]+\.(?:css|js))(?:\?v=[^"']+)?(["'])/g,`$1$2?v=${version}$3`));
          await mkdir('_site/admin',{recursive:true});
          const admin=`${manifest.origin}/admin/`;
          await writeFile('_site/admin/index.html',`<!doctype html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=${admin}"><title>Админка</title><a href="${admin}">Открыть админку</a></html>`);
          console.log(`Packaged ${manifest.files.length} verified assets and ${covers.length} uploaded covers`);
          NODE
      - uses: actions/upload-pages-artifact@v4
        if: steps.project_changes.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
